<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta
      name="description"
      content="Trade Avenue — do'konlar uchun ulgurji savdo: katalog, narxlar va buyurtmalar Telegram ichida."
    />
    <title>Trade Avenue — do'konlar uchun ulgurji savdo</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <!-- Mahsulot rasmlari shu yerdan — ulanish oldindan ochiladi -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!--
      Ochilish animatsiyasi.
      To'q ko'k fonda Trade Avenue belgisi paydo bo'ladi, yo'l chizig'i
      yugurib o'tadi, so'ng ko'rinish silliq so'nib ostidan ilova ochiladi.

      ATAYLAB shu yerda, oddiy (module bo'lmagan) skript bilan: React va
      JavaScript bundle yuklanishini kutmay, Telegram oynani ochgan zahoti
      chiziladi — oq chaqnash bo'lmaydi.

      Qoidalar:
        - ilova tayyor bo'lganda tugaydi (window 'ta:ready'), lekin kamida
          animatsiya ko'rinib ulguradi va 2,4 soniyadan ortiq kutilmaydi;
        - bosilsa darhol o'tkazib yuboriladi;
        - bir kunda qayta ochilganda — qisqaroq;
        - «harakatni kamaytirish» yoqilgan telefonda — oddiy so'nish.
    -->
    <style id="splash-style">
      #splash {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        display: grid; place-items: center; align-content: center; gap: 18px;
        background: radial-gradient(120% 90% at 50% 40%, #1e40af 0%, #142a6b 55%, #0a1433 100%);
        touch-action: none; -webkit-tap-highlight-color: transparent;
        font-family: "Montserrat", ui-sans-serif, system-ui, sans-serif;
      }
      #splash .sp-logo {
        width: 112px; height: 112px; border-radius: 28px; overflow: hidden;
        opacity: 0; transform: scale(0.84);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 18px 50px rgba(0, 0, 0, 0.45);
        animation: spLogoIn 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.25) 0.05s forwards;
      }
      #splash .sp-logo svg { display: block; width: 100%; height: 100%; }
      #splash .sp-road { stroke-dasharray: 3 20; animation: spRoad 1s linear 0.3s infinite; }
      #splash .sp-name {
        color: #ffffff; font-weight: 800; font-size: 22px; letter-spacing: 0.02em;
        opacity: 0; transform: translateY(6px); animation: spText 0.45s ease 0.3s forwards;
      }
      #splash .sp-name small {
        display: block; margin-top: 4px; text-align: center; font-size: 10px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255, 255, 255, 0.62);
      }
      #splash.is-leaving { opacity: 0; transform: scale(1.04); transition: opacity 0.45s ease, transform 0.45s ease; }
      #splash.is-quick.is-leaving { transition-duration: 0.32s; }
      @keyframes spLogoIn { to { opacity: 1; transform: scale(1); } }
      @keyframes spText { to { opacity: 1; transform: none; } }
      @keyframes spRoad { to { stroke-dashoffset: -23; } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; }
        #splash .sp-logo, #splash .sp-name { opacity: 1; transform: none; }
      }
    </style>
    <div id="splash" aria-hidden="true">
      <div class="sp-logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1d4ed8"/><rect x="13" y="13" width="38" height="7.5" rx="3.75" fill="#fff"/><path d="M32 25 L18.5 51 M32 25 L45.5 51" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/><path class="sp-road" d="M32 34.5 v3.5 M32 43 v5" fill="none" stroke="#f59e0b" stroke-width="3.4" stroke-linecap="round"/></svg></div>
      <div class="sp-name">Trade Avenue<small>Do‘konlar uchun ulgurji savdo</small></div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('splash')
        if (!root) return
        var html = document.documentElement
        html.setAttribute('data-splash', 'on')

        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var today = new Date().toDateString()
        var quick = reduce
        try {
          if (localStorage.getItem('taSplashDay') === today) quick = true
          localStorage.setItem('taSplashDay', today)
        } catch (e) { /* xotira yopiq — to'liq variant */ }
        if (quick) root.classList.add('is-quick')

        // Telegram paneli splash rangida — pastda oq chiziq qolmasin
        try {
          var tg = window.Telegram && window.Telegram.WebApp
          if (tg) {
            if (tg.setHeaderColor) tg.setHeaderColor('#142a6b')
            if (tg.setBackgroundColor) tg.setBackgroundColor('#0a1433')
          }
        } catch (e) { /* eski Telegram */ }

        var start = performance.now()
        var MIN = quick ? 380 : 1000
        var MAX = 2400
        var ready = false
        var done = false
        var cleaned = false

        function whenReady() {
          if (!ready || done) return
          var left = MIN - (performance.now() - start)
          if (left > 0) setTimeout(finish, left)
          else finish()
        }
        window.addEventListener('ta:ready', function () { ready = true; whenReady() })
        root.addEventListener('pointerdown', finish)
        setTimeout(finish, MAX)

        function finish() {
          if (done) return
          done = true
          // Kafolat: kadrlar to'xtab qolsa ham (ilova fonga o'tgan bo'lsa)
          // splash ilovani yopib qolmaydi
          setTimeout(cleanup, 1200)
          if (document.hidden) { cleanup(); return }
          root.classList.add('is-leaving')
          setTimeout(cleanup, quick ? 340 : 480)
        }

        function cleanup() {
          if (cleaned) return
          cleaned = true
          root.remove()
          var style = document.getElementById('splash-style')
          if (style) style.remove()
          html.removeAttribute('data-splash')
          window.dispatchEvent(new Event('ta:splash-done'))
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
